name: Build C-Net Web Services Android App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile_app/**'
      - '.github/workflows/mobile-android.yml'

permissions:
  contents: write

concurrency:
  group: cnet-web-services-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Analyze, test and build Android release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --project-name cnet_web_services --org com.mciedu .

      - name: Prepare C-Net branding
        run: |
          mkdir -p assets/branding
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi
          convert ../public/images/cnet-web-logo.jpeg -resize '1024x1024^' -gravity center -extent 1024x1024 assets/branding/app_icon.png
          convert ../public/images/cnet-web-logo.jpeg assets/branding/splash_logo.png
          convert assets/branding/app_icon.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert assets/branding/app_icon.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert assets/branding/app_icon.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert assets/branding/app_icon.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert assets/branding/app_icon.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          identify assets/branding/app_icon.png

      - name: Enable Android network access
        run: |
          manifest="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' "$manifest"
          sed -i 's/android:label="cnet_web_services"/android:label="C-Net Web Services"/' "$manifest"
          grep -q 'android.permission.INTERNET' "$manifest"
          grep -q 'android.permission.ACCESS_NETWORK_STATE' "$manifest"
          grep -q 'android:label="C-Net Web Services"' "$manifest"

      - name: Configure permanent release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/cnet-web-services-upload-key.jks
            bash tool/configure_android_signing.sh
            echo "PLAY_STORE_SIGNING=enabled" >> "$GITHUB_ENV"
          else
            echo "PLAY_STORE_SIGNING=not-configured" >> "$GITHUB_ENV"
            echo "Permanent signing secrets are not configured; producing an installable test release."
          fi

      - name: Remove generated sample test
        run: rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Generate branded splash screen
        run: dart run flutter_native_splash:create

      - name: Normalize Dart formatting
        run: dart format lib test

      - name: Analyze source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build installable APK
        run: flutter build apk --release

      - name: Build Play Store bundle
        run: flutter build appbundle --release

      - name: Verify release signing
        run: |
          jarsigner -verify -certs build/app/outputs/bundle/release/app-release.aab
          echo "Signing mode: $PLAY_STORE_SIGNING"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: C-Net-Web-Services-Android-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: C-Net-Web-Services-Android-AAB
          path: mobile_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish permanent website APK download
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp mobile_app/build/app/outputs/flutter-apk/app-release.apk C-Net-Web-Services.apk
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest C-Net-Web-Services.apk --clobber
          else
            gh release create android-latest C-Net-Web-Services.apk \
              --title "C-Net Web Services Android App" \
              --notes "Latest signed Android installation package for C-Net Web Services." \
              --latest
          fi

name: Build C-Net Web Services Android App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile_app/**'
      - '.github/workflows/mobile-android.yml'

permissions:
  contents: read

concurrency:
  group: cnet-web-services-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Analyze, test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --project-name cnet_web_services --org com.mciedu .

      - name: Enable Android network access
        run: |
          manifest="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' "$manifest"
          grep -q 'android.permission.INTERNET' "$manifest"
          grep -q 'android.permission.ACCESS_NETWORK_STATE' "$manifest"

      - name: Remove generated sample test
        run: rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Normalize Dart formatting
        run: dart format lib test

      - name: Analyze source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build installable APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: C-Net-Web-Services-Android-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
